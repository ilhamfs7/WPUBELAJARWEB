<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Form</title>
</head>
<body>
    <h1>Contoh elemen pada form HTML</h1>

    <form>
        <label for="nama">Nama:
            <input type="text" name="nama" id="nama" placeholder="Masukkan nama">
        </label>
        <br>
        <label for="password">Password:
            <input type="password" name="password" id="password" placeholder="Masukkan password">
        </label>
        <br>
        <label for="email">Email:
            <input type="email" name="email" id="email" placeholder="Masukkan email">
        </label>
        <br>
        <label for="angka">Alamat:
            <input type="number" name="number" id="angka" placeholder="Masukkan angka" min="0" max="100" step="5"></input>
        </label>
        <br>
        <label for="tanggal">Tanggal:
            <input type="date" name="tanggal" id="tanggal">
        </label>
        <br>
        <label for="warna">Warna:
            <input type="color" name="warna" id="warna">
        </label>
        <br>
        <button type="submit">Kirim</button>
    </form> 
</body>
</html>
